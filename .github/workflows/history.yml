name: Price history and backtest

# Weekdays after the US close, and on demand: refresh daily prices (Yahoo, no key) for the
# ETF universe and BTC/ETH into state/history/, then rerun the fair backtest.
on:
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/fetch-history.js
      - run: node scripts/backtest-etf.js
      - name: Save results
        run: |
          git config user.name "trading-floor bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/history state/backtest-etf.json
          git diff --cached --quiet || git commit -m "Price history and backtest $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
