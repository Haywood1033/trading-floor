name: Daily desk run

# Weekdays after the US close (21:30 UTC is 5:30pm New York in summer, 4:30pm in winter).
# Also runnable by hand from the Actions tab.
on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-desk
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Run quants on the Alpaca paper account (read-only)
        run: node scripts/daily.js
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      - name: Save results
        run: |
          git config user.name "trading-floor bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Daily desk run $(date -u +%Y-%m-%d)"
          git push
